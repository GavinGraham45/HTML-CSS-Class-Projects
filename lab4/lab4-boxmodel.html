<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 300px;
            height: 150px;
            border: 5px solid blue;
            padding: 20px;
            margin: 20px;
            background-color: lightgray;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <h1>CSS Box Model Lab</h1>

    <div class="box">
        <p>This is a demonstration of the CSS Box Model.</p>
    </div>

    <div class="box">
        <p>This is another box using the same class to show how margins create space between elements.</p>
    </div>
</body>
</html>
